name: unit-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Gate the test jobs on whether app code actually changed (mirrors console's
  # reusable-should-validate). Always runs on push to main; on PRs, runs only
  # when relevant paths changed — so chore/docs/CI-only PRs skip the suite.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'apps/deploy-web/**'
              - 'packages/**'
              - 'package-lock.json'
              - '.github/workflows/unit-tests.yml'

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to match packageManager field
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Run package unit tests
        run: npm run test -w ./packages --if-present

      - name: Run deploy-web unit tests
        run: npm run test:unit -w apps/deploy-web

  type-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to match packageManager field
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Type-check deploy-web
        run: npm run type-check -w apps/deploy-web
